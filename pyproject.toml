[project]
name = "sovereign-ledger"
version = "0.1.0"
description = "Sovereign double-entry ledger — hexagonal core, FastAPI+HTMX delivery, PostgreSQL system of record"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]==3.3.5",
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings>=2.0,<3",
    "jinja2==3.1.6",
    "jinja2-fragments==1.12.0",
    "itsdangerous==2.2.0",
    "argon2-cffi==25.1.0",
    "ofxtools==1.1.1",
    "python-dateutil==2.9.0.post0",
    "charset-normalizer==3.5.1",
]

[dependency-groups]
dev = [
    "hypothesis==6.167.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]